<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102a25" />
    <meta name="description" content="无需网络即可游玩的国际象棋，电脑棋力约 1000 分。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="高山棋局" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>高山棋局</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="高山棋局首页">
          <span class="brand-mark" aria-hidden="true">♞</span>
          <span>
            <strong>高山棋局</strong>
            <small>KILIMANJARO CHESS</small>
          </span>
        </a>
        <div class="connection" id="connectionStatus" role="status">
          <span class="connection-dot" aria-hidden="true"></span>
          <span>可离线使用</span>
        </div>
      </header>

      <main class="game-layout">
        <section class="play-area" aria-label="国际象棋棋盘">
          <div class="player-row opponent-row">
            <div class="player-identity">
              <span class="avatar computer-avatar" aria-hidden="true">♞</span>
              <span><strong>高山向导</strong><small>电脑 · 约 1000 分</small></span>
            </div>
            <span class="thinking-badge" id="thinkingBadge" hidden><i></i>思考中</span>
          </div>

          <div class="board-frame">
            <div class="board" id="board" role="grid" aria-label="国际象棋棋盘"></div>
          </div>

          <div class="player-row">
            <div class="player-identity">
              <span class="avatar human-avatar" aria-hidden="true">你</span>
              <span><strong>登山者</strong><small id="playerSideLabel">执白棋</small></span>
            </div>
            <span class="turn-indicator" id="turnIndicator">轮到你</span>
          </div>
        </section>

        <aside class="control-panel" aria-label="对局控制">
          <section class="status-card" aria-live="polite">
            <span class="eyebrow">当前局面</span>
            <h1 id="statusTitle">轮到你走</h1>
            <p id="statusDetail">点一下棋子，再点它要去的位置。</p>
          </section>

          <section class="side-choice" aria-labelledby="sideTitle">
            <div class="section-heading">
              <h2 id="sideTitle">选择阵营</h2>
              <span>新局生效</span>
            </div>
            <div class="segmented" role="group" aria-label="选择阵营">
              <button class="side-button active" type="button" data-side="w" aria-pressed="true"><img src="./pieces/wP.svg" alt="" width="26" height="26" />执白</button>
              <button class="side-button" type="button" data-side="b" aria-pressed="false"><img src="./pieces/bP.svg" alt="" width="26" height="26" />执黑</button>
            </div>
          </section>

          <section class="moves-section" aria-labelledby="movesTitle">
            <div class="section-heading">
              <h2 id="movesTitle">走棋记录</h2>
              <span id="moveCount">第 1 回合</span>
            </div>
            <p class="last-move-summary" id="lastMoveSummary" aria-live="polite" hidden></p>
            <div class="moves-list empty" id="movesList">
              <div class="empty-moves"><span aria-hidden="true">♙</span><p>第一步，从这里开始。</p></div>
            </div>
          </section>

          <div class="actions">
            <button class="primary-action" id="newGameButton" type="button">
              <span aria-hidden="true">↻</span>新对局
            </button>
            <button class="icon-action" id="undoButton" type="button" aria-label="悔棋" title="悔棋">
              <span aria-hidden="true">↶</span>
            </button>
            <button class="icon-action" id="flipButton" type="button" aria-label="旋转棋盘" title="旋转棋盘">
              <span aria-hidden="true">⇅</span>
            </button>
          </div>

          <button class="install-button" id="installButton" type="button">
            <span aria-hidden="true">↓</span>
            <span><strong>安装到手机</strong><small>装好后，无信号也能打开</small></span>
          </button>
        </aside>
      </main>

      <footer>
        <span>每一步都会保存在这台设备上</span>
        <span class="footer-mark">离线引擎 · 低耗电 · <a href="./pieces/NOTICE.txt" target="_blank" rel="noopener">棋子署名</a></span>
      </footer>
    </div>

    <dialog id="installDialog" aria-labelledby="installTitle">
      <form method="dialog" class="dialog-card">
        <button class="dialog-close" value="close" aria-label="关闭">×</button>
        <div class="dialog-icon" aria-hidden="true">♞</div>
        <h2 id="installTitle">带它一起上山</h2>
        <p id="installInstructions">在浏览器菜单里选择“添加到主屏幕”或“安装应用”。安装后请先打开一次，之后没有网络也能继续下棋。</p>
        <button class="dialog-confirm" value="close">知道了</button>
      </form>
    </dialog>

    <dialog id="promotionDialog" aria-labelledby="promotionTitle">
      <div class="promotion-card">
        <h2 id="promotionTitle">兵升变为</h2>
        <div class="promotion-options" id="promotionOptions"></div>
      </div>
    </dialog>

    <dialog class="result-dialog" id="resultDialog" aria-labelledby="resultTitle" aria-describedby="resultDescription">
      <div class="result-card" id="resultCard">
        <div class="result-confetti" id="resultConfetti" aria-hidden="true"></div>
        <button class="dialog-close" id="resultCloseButton" type="button" aria-label="关闭结果，查看棋盘" autofocus>×</button>
        <div class="result-emblem" id="resultEmblem" aria-hidden="true"></div>
        <p class="result-eyebrow" id="resultEyebrow"></p>
        <h2 id="resultTitle"></h2>
        <p class="result-description" id="resultDescription"></p>
        <p class="result-score" id="resultScore" aria-label="对局比分"></p>
        <button class="dialog-confirm" id="resultNewGameButton" type="button">再来一局</button>
        <button class="result-board-button" id="resultBoardButton" type="button">看看最后的棋局</button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" defer></script>
  </body>
</html>
